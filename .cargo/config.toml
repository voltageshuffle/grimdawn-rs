[alias]
dev = "run -p grimdawn --features dev"
dev-build = "build -p grimdawn --features dev"

# rust-lld ships in the rustup sysroot and links far faster than MSVC's link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package.gd-formats]
opt-level = 3

[profile.dev.package.gd-sim]
opt-level = 3

[profile.dev.package.gd-rules]
opt-level = 3

[profile.dev.package.gd-audio]
opt-level = 3

[profile.dev.package.log]
debug-assertions = true

[profile.dev.package.tracing]
debug-assertions = true

[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"

# `perf record` build: release code and flags (what players run), symbols kept.
[profile.profiling]
inherits = "release"
strip = "none"
debug = "line-tables-only"

# Logs on in profiling builds: the game crates gate their log macros on `debug_assertions` (the dev
# profile's trick), and tracing's `release_max_level_off` keys on it too. GD_FPS / GD_GPU_TIMES only
# report through the log.
[profile.profiling.package.gd-game-core]
debug-assertions = true

[profile.profiling.package.gd-game]
debug-assertions = true

[profile.profiling.package.tracing]
debug-assertions = true
