[alias]
dev = "run -p grimdawn --features dev"
dev-build = "build -p grimdawn --features dev"

# rust-lld ships in the rustup sysroot and links far faster than MSVC's link.exe.
[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"

[profile.dev]
opt-level = 1
debug = "line-tables-only"
panic = "abort"

[profile.dev.package."*"]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false

[profile.dev.package.gd-formats]
opt-level = 3

[profile.dev.package.gd-sim]
opt-level = 3

[profile.dev.package.gd-rules]
opt-level = 3

[profile.dev.package.gd-audio]
opt-level = 3

[profile.dev.package.log]
debug-assertions = true

[profile.dev.package.tracing]
debug-assertions = true

[profile.release]
strip = "symbols"
lto = "thin"
panic = "abort"

[profile.profiling]
inherits = "dev"
opt-level = 3
strip = "none"
debug-assertions = false
overflow-checks = false

[profile.profiling.package.log]
debug-assertions = true

[profile.profiling.package.tracing]
debug-assertions = true
