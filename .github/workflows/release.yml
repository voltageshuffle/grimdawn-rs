# Builds the game for x86-64 Linux and Windows and publishes a GitHub release when a `v*` tag is pushed (the tag is
# `v<workspace version>`, docs/running.md). The release is titled and described by scripts/release-notes: the Grim
# Dawn version it is for, then the commits since the previous `v*` tag.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: grimdawn-rs-linux-x86_64.tar.gz
          - os: windows-latest
            archive: grimdawn-rs-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # Defender scans every object and rlib the build writes; the hosted runner is throwaway.
      - name: Windows Defender off
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Toolchain
        run: rustup update stable --no-self-update

      # A tag's cache is only seen by a re-run of that tag (GitHub scopes caches to the ref): failed runs save it
      # too, so a re-run after a flaky step does not start cold.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # Default features only: `dev` must never ship.
      - name: Build
        run: cargo build -p grimdawn --release --locked

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/grimdawn README.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/grimdawn.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # Full history and tags: the notes list the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        run: |
          scripts/release-notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" grimdawn-rs-*.tar.gz grimdawn-rs-*.zip \
            --title "$(scripts/release-notes --title "$GITHUB_REF_NAME")" --notes-file release-notes.md
