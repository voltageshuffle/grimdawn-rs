# Builds x86-64 Linux and Windows and publishes a GitHub release when a `v*` tag is pushed; titled and described
# by scripts/release-notes.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            archive: grimdawn-rs-linux-x86_64.tar.gz
            rustflags: >-
              -Zthreads=8 -Zlocation-detail=none -Zfmt-debug=shallow
              -Clink-arg=-fuse-ld=mold -Clink-arg=-Wl,-z,pack-relative-relocs
          - os: windows-latest
            archive: grimdawn-rs-windows-x86_64.zip
            rustflags: -Zthreads=8 -Zlocation-detail=none -Zfmt-debug=shallow
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev mold

      - name: Toolchain
        run: |
          rustup toolchain install nightly --profile minimal --no-self-update
          rustup default nightly

      - name: Build
        run: cargo build -p grimdawn --release --locked -Zembed-metadata=no

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/release/grimdawn README.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/grimdawn.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish
        run: |
          scripts/release-notes "$GITHUB_REF_NAME" > release-notes.md
          gh release create "$GITHUB_REF_NAME" grimdawn-rs-*.tar.gz grimdawn-rs-*.zip \
            --title "$(scripts/release-notes --title "$GITHUB_REF_NAME")" --notes-file release-notes.md
