# Release builds of the game binary for x86-64 Linux (Wayland + X11) and Windows.
# Runs by hand (Actions → Release → Run workflow) or on a `v*` tag; a tag also publishes a GitHub release
# with both archives, titled with the Grim Dawn version it is for, and notes from scripts/release-notes (that
# game version, then the commits since the previous `v*` tag). Builds with the latest stable Rust.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: grimdawn-rs-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: grimdawn-rs-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # Defender scans every object and rlib the build writes; the hosted runner is throwaway.
      - name: Windows Defender off
        if: runner.os == 'Windows'
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build -p grimdawn --release --locked --target ${{ matrix.target }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/grimdawn README.md LICENSE dist/
          tar -czf ${{ matrix.archive }} -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/grimdawn.exe, README.md, LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the notes list the commits since the previous tag.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Release notes
        run: |
          echo "title=$(scripts/release-notes --title "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
          scripts/release-notes "$GITHUB_REF_NAME" > release-notes.md
        id: notes
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.title }}
          body_path: release-notes.md
          files: |
            grimdawn-rs-linux-x86_64.tar.gz
            grimdawn-rs-windows-x86_64.zip
