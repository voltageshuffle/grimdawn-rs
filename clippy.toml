allow-panic-in-tests = true
allow-dbg-in-tests = true

disallowed-types = [
  { path = "std::collections::HashMap", reason = "SipHash-1-3 is 2-4x slower than foldhash on our trusted game keys; use the gd-formats alias (foldhash::fast::FixedState)", replacement = "gd_formats::collections::HashMap" },
  { path = "std::collections::HashSet", reason = "SipHash-1-3 is 2-4x slower than foldhash on our trusted game keys; use the gd-formats alias (foldhash::fast::FixedState)", replacement = "gd_formats::collections::HashSet" },
  { path = "std::sync::Mutex", reason = "std Mutex poisons on panic (pointless here — a panic aborts) and forces .unwrap()/into_inner boilerplate; parking_lot has no poisoning and is faster under contention", replacement = "parking_lot::Mutex" },
  { path = "std::sync::RwLock", reason = "std RwLock poisons on panic (pointless here — a panic aborts) and forces .unwrap()/into_inner boilerplate; parking_lot has no poisoning and is faster under contention", replacement = "parking_lot::RwLock" },
]
