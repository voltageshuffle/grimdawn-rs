[package]
name = "gd-formats"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Readers for Grim Dawn data formats"

[dependencies]
anyhow = "1.0.104"
lz4_flex = "0.14.0"
texture2ddecoder = "0.1.2"

[features]
# Test support (`testdata`): data-test paths and temp dirs; never in a runtime build.
testdata = []

[dev-dependencies]
gd-formats = { path = ".", features = ["testdata"] }
