lints.workspace = true

[package]
name = "gd-game-core"
version.workspace = true
edition = "2024"
description = "Grim Dawn's gameplay data leaf: components, resources, messages, pure resolvers and system sets shared by gd-game and gd-render"
license = "MIT"

[features]
# Dev builds only: the `hooks` module (`Hooks`, the `GD_*` test hooks read from the environment). Every crate's
# `dev` that names `Hooks` forwards here; a build without it (release, tests) has no hooks at all.
dev = []

[dependencies]
anyhow = "1.0.104"
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "async_executor",
    "bevy_log",
    "multi_threaded",
    "std",
  ]
}
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats" }
gd-rules = { path = "../gd-rules" }
gd-sim = { path = "../gd-sim" }
gd-story = { path = "../gd-story" }
log = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
parking_lot = "0.12"
tracing = { version = "*", features = ["max_level_debug", "release_max_level_warn"] }
