lints.workspace = true

[package]
name = "gd-game"
version.workspace = true
edition = "2024"
description = "Headless gameplay state and systems (Bevy ECS without rendering, windows or input)"
license = "MIT"

[features]
# Set by grimdawn's `dev`: the `GD_*` hook systems and reads. Tests run without it.
dev = ["gd-game-core/dev"]
testing = ["gd-formats/testdata"]

[dependencies]
anyhow = "1.0.104"
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "async_executor",
    "bevy_log",
    "multi_threaded",
    "std",
  ]
}
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats" }
gd-game-core = { path = "../gd-game-core" }
gd-rules = { path = "../gd-rules" }
gd-sim = { path = "../gd-sim" }
gd-story = { path = "../gd-story" }
log = { version = "*", features = ["max_level_debug", "release_max_level_off"] }
parking_lot = "0.12"
tracing = { version = "*", features = ["max_level_debug", "release_max_level_off"] }

[dev-dependencies]
gd-game = { path = ".", features = ["testing"] }
