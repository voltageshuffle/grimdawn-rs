lints.workspace = true

[package]
name = "gd-render"
version.workspace = true
edition = "2024"
description = "Grim Dawn's look on Bevy: the game's shading, lighting and post chain, models, textures, characters, effects and the drawing halves of water / weather over gd-game-core"
license = "MIT"

[features]
# Dev builds: the `GD_*` hook reads and the dev-gated render code (the `GD_FPS` effect counters, fx/mod.rs).
# grimdawn's `dev` forwards here; the hooks resource is gd-game-core's, which this forwards to.
dev = ["gd-game-core/dev"]

[dependencies]
anyhow = "1.0.104"
# Only what the port uses (no glTF, animation, gizmos, picking, scenes, UI widgets, sprites or Bevy's default
# font: the game draws its own models, animation, cursor and fonts). grimdawn adds audio.
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "default_app",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_light",
    "bevy_material",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_shader",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "hdr",
    "multi_threaded",
    "png",
    "std",
    "wayland",
    "x11",
  ]
}
gd-formats = { path = "../gd-formats" }
gd-game-core = { path = "../gd-game-core" }
gd-sim = { path = "../gd-sim" }
parking_lot = "0.12"
