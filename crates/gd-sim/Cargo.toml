lints.workspace = true

[package]
name = "gd-sim"
version.workspace = true
edition = "2024"
description = "Grim Dawn game rules, independent of rendering and Bevy: stats, combat, skills, items, nav"
license = "MIT"

[features]
# Data-test fixtures (`testdata`), for this crate's and dependents' tests.
testdata = ["gd-formats/testdata"]

[dependencies]
anyhow = "1.0.104"
gd-formats = { path = "../gd-formats" }
gd-rules = { path = "../gd-rules" }
parking_lot = "0.12"

[dev-dependencies]
gd-sim = { path = ".", features = ["testdata"] }
