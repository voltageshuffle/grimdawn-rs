lints.workspace = true

[package]
name = "gd-story"
version.workspace = true
edition = "2024"
description = "Grim Dawn story layer: quests, conversations, area triggers, the Lua 5.1 script host and Shattered Realm generation"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
gd-formats = { path = "../gd-formats" }
gd-rules = { path = "../gd-rules" }
log = { version = "*", features = ["max_level_debug", "release_max_level_off"] }
mlua = { version = "0.12", features = ["lua51", "vendored"] }

[dev-dependencies]
# The story data test resolves item footprints with gd-sim's item rules.
gd-sim = { path = "../gd-sim", features = ["testdata"] }
