lints.workspace = true

[package]
name = "gd-story"
version = "0.1.0"
edition = "2024"
description = "Grim Dawn story layer: quests, conversations, area triggers, the Lua 5.1 script host and Shattered Realm generation"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
gd-formats = { path = "../gd-formats", version = "0.1.0" }
gd-rules = { path = "../gd-rules", version = "0.1.0" }
mlua = { version = "0.12", features = ["lua51", "vendored"] }

[dev-dependencies]
# The story data test plays the install's main quest through a test env that
# resolves item footprints with gd-sim's item rules (the runtime env lives in
# gd-game, above this crate).
gd-sim = { path = "../gd-sim", version = "0.1.0", features = ["testdata"] }