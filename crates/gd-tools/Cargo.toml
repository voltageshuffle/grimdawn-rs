lints.workspace = true

[package]
name = "gd-tools"
version.workspace = true
edition = "2024"
description = "Command-line tools to list, extract and inspect Grim Dawn archives, records, maps, meshes and saves"
license = "MIT"

# The CLIs have no tests: `test = false` keeps `cargo test` from building an
# empty test binary for each.
[[bin]]
name = "gd-tools"
path = "src/main.rs"
test = false

[[bin]]
name = "gd-map"
path = "src/bin/gd-map.rs"
test = false

[[bin]]
name = "gd-mesh"
path = "src/bin/gd-mesh.rs"
test = false

[[bin]]
name = "gd-nav"
path = "src/bin/gd-nav.rs"
test = false

[[bin]]
name = "gd-pfx"
path = "src/bin/gd-pfx.rs"
test = false

[[bin]]
name = "gd-save"
path = "src/bin/gd-save.rs"
test = false

[[bin]]
name = "gd-rec"
path = "src/bin/gd-rec.rs"
test = false

[[bin]]
name = "gd-story"
path = "src/bin/gd-story.rs"
test = false

[[bin]]
name = "gd-tex"
path = "src/bin/gd-tex.rs"
test = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
gd-formats = { path = "../gd-formats", features = ["testdata"] }
gd-sim = { path = "../gd-sim" }
png = "0.18.1"
