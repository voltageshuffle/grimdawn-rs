lints.workspace = true

[package]
name = "gd-ui-kit"
version.workspace = true
edition = "2024"
description = "Grim Dawn's shared UI kit: the record-driven widget builder, fonts, chrome, scroll bars, confirm boxes, key bindings and the additive / masked UI materials over gd-game-core and gd-render"
license = "MIT"

[dependencies]
# The UI's own records, fonts and text layout (gd-formats), the gameplay data the builder reads
# (gd-game-core: GameData / GameOptions / Requirements), the UI scale's sheet maths (gd-sim)
# and the texture cache (gd-render). No gd-game: the kit compiles in parallel with the gameplay systems.
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_material",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "multi_threaded",
    "std",
  ]
}
gd-formats = { path = "../gd-formats" }
gd-game-core = { path = "../gd-game-core" }
gd-render = { path = "../gd-render" }
gd-sim = { path = "../gd-sim" }
# TrueType metrics for the FNTD (ja/ko/zh/vi) fonts so layout measures what Bevy renders
# (already in the tree via Bevy text; no extra compile cost).
owned_ttf_parser = "0.25"
