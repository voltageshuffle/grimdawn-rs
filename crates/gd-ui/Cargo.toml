lints.workspace = true

[package]
name = "gd-ui"
version.workspace = true
edition = "2024"
description = "Grim Dawn's in-game UI windows and HUD over gd-ui-kit, gd-game and gd-render: the record-driven window clusters, the rebuild hub, the Esc dispatcher and the presentation state the binary's input systems share"
license = "MIT"

[features]
dev = ["gd-game-core/dev"]

[dependencies]
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_window",
    "custom_cursor",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_material",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "multi_threaded",
    "std",
  ]
}
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats" }
gd-game = { path = "../gd-game" }
gd-game-core = { path = "../gd-game-core" }
gd-render = { path = "../gd-render" }
gd-rules = { path = "../gd-rules" }
gd-sim = { path = "../gd-sim" }
gd-story = { path = "../gd-story" }
gd-ui-kit = { path = "../gd-ui-kit" }
libc = "0.2"