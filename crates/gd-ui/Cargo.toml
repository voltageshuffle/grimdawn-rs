lints.workspace = true

[package]
name = "gd-ui"
version = "0.1.0"
edition = "2024"
description = "Grim Dawn's in-game UI windows and HUD over gd-ui-kit, gd-game and gd-render: the record-driven window clusters, the rebuild hub, the Esc dispatcher and the presentation state the binary's input systems share"
license = "MIT"

[features]
# Dev builds: the `GD_*` hook systems the windows carry (the hooks resource is gd-game-core's).
dev = []

[dependencies]
# The UI records / fonts / text layout (gd-formats), the gameplay the windows read and send requests to
# (gd-game, gd-game-core), the models / textures the paper doll and tooltips draw (gd-render), the sheet
# maths (gd-sim), the quest / faction rules (gd-story, gd-rules) and the shared widget kit (gd-ui-kit).
bevy = {
  version = "0.20",
  default-features = false,
  features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_window",
    "custom_cursor",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_log",
    "bevy_material",
    "bevy_render",
    "bevy_shader",
    "bevy_sprite",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "multi_threaded",
    "std",
  ]
}
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats", version = "0.1.0" }
gd-game = { path = "../gd-game", version = "0.1.0" }
gd-game-core = { path = "../gd-game-core", version = "0.1.0" }
gd-render = { path = "../gd-render", version = "0.1.0" }
gd-rules = { path = "../gd-rules", version = "0.1.0" }
gd-sim = { path = "../gd-sim", version = "0.1.0" }
gd-story = { path = "../gd-story", version = "0.1.0" }
gd-ui-kit = { path = "../gd-ui-kit", version = "0.1.0" }
libc = "0.2"