lints.workspace = true

[package]
name = "gd-world"
version.workspace = true
edition = "2024"
description = "Grim Dawn world streaming on Bevy: levels parsed in the background and spawned a slice per frame, decoration animation"
license = "MIT"

[features]
# Dev builds: the `GD_*` hook reads of the streaming (the hooks resource is gd-game-core's, which this forwards to).
# grimdawn's `dev` forwards here.
dev = ["gd-game-core/dev"]

[dependencies]
anyhow = "1.0.104"
bevy = { version = "0.20", default-features = false }
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats" }
gd-game = { path = "../gd-game" }
gd-game-core = { path = "../gd-game-core" }
gd-render = { path = "../gd-render" }
gd-sim = { path = "../gd-sim" }
