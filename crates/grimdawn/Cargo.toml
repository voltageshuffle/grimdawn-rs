lints.workspace = true

[package]
name = "grimdawn"
version = "0.1.0"
edition = "2024"
description = "Grim Dawn reimplementation on Bevy: UI, input, audio and world streaming over gd-game and gd-render"
license = "MIT"

[features]
# `cargo dev --features audit`: component / resource names for the session audit (`GD_CENSUS`, src/dev/audit.rs).
audit = ["bevy/debug", "dev"]
# Dev builds (`cargo dev` / `cargo dev-build`): the `GD_*` hooks are read from the environment and the dev tools
# (`src/dev/`: screenshots, test scenes, census, exit cycles, frame-time log) and scripted test systems exist.
# A build without it reads no hook and has none of them.
dev = ["gd-game/dev", "gd-render/dev", "gd-ui/dev"]
# `cargo dev --features profile`: Chrome-trace system spans; `GD_FPS` for frame times (docs/running.md).
profile = ["bevy/trace_chrome", "dev"]

[dependencies]
anyhow = "1.0.104"
# The render feature set is gd-render's; this adds audio (the game's sounds are WAV and Ogg Vorbis).
bevy = { version = "0.20", default-features = false, features = ["bevy_audio", "custom_cursor", "vorbis", "wav"] }
# The audio devices (`audio::devices`) and the mixer's rate; the cpal rodio plays through.
cpal = "0.17"
fastrand = "2.5.0"
gd-formats = { path = "../gd-formats", version = "0.1.0" }
gd-game = { path = "../gd-game", version = "0.1.0" }
gd-game-core = { path = "../gd-game-core", version = "0.1.0" }
gd-render = { path = "../gd-render", version = "0.1.0" }
gd-rules = { path = "../gd-rules", version = "0.1.0" }
gd-sim = { path = "../gd-sim", version = "0.1.0" }
gd-story = { path = "../gd-story", version = "0.1.0" }
gd-ui = { path = "../gd-ui", version = "0.1.0" }
gd-ui-kit = { path = "../gd-ui-kit", version = "0.1.0" }
libc = "0.2"
# No-poison locks for the mixer's shared bus state (already in the tree via Bevy).
parking_lot = "0.12"
# The port-owned output sink for the sound mixer (`audio::mixer`): bevy_audio opens only the default device.
# Same rodio bevy_audio locks (0.22.2); its `playback` + `tracing` features unify, no extra decoders.
rodio = { version = "0.22", default-features = false, features = ["playback"] }
# The render adapters the options Video tab lists (`render_devices`) and the launch adapter choice in `main`;
# features unify with bevy_render's wgpu (already locked 30.0.2).
wgpu = { version = "30", default-features = false }
